const TABLES = 3;
const CLS = [["S-75","S −75"],["S+75","S +75"],["A","A 無差別"],["B","B 無差別"],["C-75","C −75"],["C+75","C +75"]];
const ARMS = [["R","右"],["L","左"]];
const KEYS = [];
CLS.forEach(c => ARMS.forEach(a => KEYS.push(c[0] + "_" + a[0])));
const TNAME = ["A台","B台","C台"];
const CLS_ORDER = ["C-75","C+75","B","A","S-75","S+75"];
// 左を全部先に → そのあと右
const DEFAULT_ORDER = [...CLS_ORDER.map(c => c + "_L"), ...CLS_ORDER.map(c => c + "_R")];
const POOL = { W: "本戦", L: "敗者復活戦", F: "決勝", F2: "決勝 2試合目" };

function clsLabel(c){ const x = CLS.find(v => v[0] === c); return x ? x[1] : c; }
function armLabel(a){ return a === "R" ? "右" : a === "L" ? "左" : a; }
function keyLabel(k){ const i = k.lastIndexOf("_"); return clsLabel(k.slice(0, i)) + " " + armLabel(k.slice(i + 1)); }

function hstr(s){ let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
function rngFrom(seed){ let a = seed >>> 0; return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rng){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pk(a, b){ return a < b ? a + "|" + b : b + "|" + a; }

function freshState(){
  const S = { players: {}, br: {}, m: [], tables: Array(TABLES).fill(null), started: false, finals: false, lastEnd: {}, finalOrder: [] };
  KEYS.forEach(k => S.br[k] = { k, ent: {}, elim: [], played: {}, byes: [], rounds: { W: [], L: [] }, elimRd: {}, ready: false, champ: null, second: null, third: null, hasF: false });
  S.order = DEFAULT_ORDER.slice(); S.tableKey = Array(TABLES).fill(null); S.claim = Array(TABLES).fill(null); S.autoAssign = false; S.idle = Array(TABLES).fill(0); S.soloAck = {};
  return S;
}

function replay(evs){
  let start = 0;
  for (let i = evs.length - 1; i >= 0; i--) if (evs[i].type === "reset"){ start = i + 1; break; }
  const S = freshState();
  // 結果の修正：あとから「正しい勝者」を指定されたら、元の結果をその勝者に置きかえて計算し直す
  S.fix = {};
  for (let i = start; i < evs.length; i++) if (evs[i].type === "fix" && evs[i].target) S.fix[evs[i].target] = evs[i].w;
  S.applied = 0; S.skipped = 0;
  for (let i = start; i < evs.length; i++){
    const ev = evs[i];
    try { apply(S, ev); post(S, ev); } catch (e) { console.warn("skip", ev, e); }
  }
  return S;
}

// 受付：金額（片腕ワンハンド4,000円・両腕ツーハンド5,000円）、検量が必要か、エントリー完了か
const FEE_ONE = 4000, FEE_TWO = 5000;
function feeOf(p){
  // 遅刻で出られなくなった腕（missed）は、料金に数えない
  const arm = a => (p.en[a] || []).some(c => !(p.missed || []).includes(c + "_" + a));
  return arm("L") && arm("R") ? FEE_TWO : FEE_ONE;
}
function handOf(p){ return feeOf(p) === FEE_TWO ? "ツーハンド" : "ワンハンド"; }
// 1人だけのクラスの、ひとつ上のクラス（S +75 はなし）
const UP = { "C-75": ["C+75"], "C+75": ["B"], "B": ["A"], "A": ["S-75", "S+75"], "S-75": ["S+75"], "S+75": [] };
function upKeys(k){ const i = k.lastIndexOf("_"); return (UP[k.slice(0, i)] || []).map(c => c + "_" + k.slice(i + 1)); }
// 試合開始のあとで、まだ相談が終わっていない「1人だけのクラス」
function soloKeys(S){ return S.started ? KEYS.filter(k => Object.keys(S.br[k].ent).length === 1 && !S.soloAck[k] && !begun(S, k)) : []; }
// 道場名を比べるための形：全角半角・大文字小文字・空白・「道場」「ジム」などの違いはそろえる
const DOJO_WORDS = ["アームレスリング", "armwrestling", "armwrestle", "同好会", "道場", "ジム", "クラブ", "チーム", "腕相撲", "team", "gym", "club", "部", "会"];
function dojoKey(d){
  let s = String(d || "").normalize("NFKC").toLowerCase().replace(/[\s・\-_.　]+/g, "");
  if (!s || ["無所属", "なし", "無し", "none", "no", "-", "ー"].includes(s)) return "";   // 無所属どうしは「同じ道場」にしない
  const base = s;
  let changed = true;
  while (changed){ changed = false;
    for (const w of DOJO_WORDS){ if (s.length > w.length && s.endsWith(w)){ s = s.slice(0, -w.length); changed = true; } if (s.length > w.length && s.startsWith(w)){ s = s.slice(w.length); changed = true; } } }
  return s || base;
}
function needWeigh(p){ return p.keys.some(k => k.startsWith("S-75_") || k.startsWith("C-75_")); }
function entryOK(p){ return !!p.paid && (!needWeigh(p) || p.weighed); }
// 試合開始のあとに受付が終わった人：まだ始まっていないクラスなら入れる
function lateJoin(S, pid){
  const p = S.players[pid];
  if (!S.started || !p.excluded || !entryOK(p)) return;
  p.excluded = false; p.missed = [];
  p.keys.forEach(k => { if (begun(S, k)) p.missed.push(k); else { S.br[k].ent[pid] = { losses: 0, byes: 0, out: false, wd: false }; rebuild(S, k); } });
  p.keys = p.keys.filter(k => !p.missed.includes(k));
}
// このクラスの試合が1試合でも始まっているか
function begun(S, k){ const b = S.br[k]; return !!b.hasF || S.m.some(m => m.k === k && (m.st === "p" || m.st === "d")); }
// まだ始まっていないクラスの組み合わせを作り直す（試合開始のあとのクラス変更用）
function rebuild(S, k){
  const b = S.br[k];
  S.m.forEach(m => { if (m.k === k && m.st === "q") m.st = "x"; });
  Object.assign(b, { elim: [], played: {}, byes: [], rounds: { W: [], L: [] }, elimRd: {}, ready: false, champ: null, second: null, third: null, hasF: false });
  Object.keys(b.ent).forEach(p => { b.ent[p] = { losses: 0, byes: 0, out: false, wd: false }; });
}
// 腕ごとのクラス（ダブルエントリーなら2つ以上）
function normEntries(e){
  const en = {};
  ["L","R"].forEach(a => {
    const v = e && e[a]; const arr = (Array.isArray(v) ? v : v ? [v] : []).filter((c, i, x) => CLS.some(z => z[0] === c) && x.indexOf(c) === i);
    if (arr.length) en[a] = arr;
  });
  return en;
}
function entryKeys(en){ const ks = []; ["L","R"].forEach(a => (en[a] || []).forEach(c => ks.push(c + "_" + a))); return ks; }
function addPlayer(S, p){
  if (!p || !p.pid || S.players[p.pid]) return;
  const cut = v => String(v || "").trim().slice(0, 20);
  const last = cut(p.last), first = cut(p.first), enLast = cut(p.enLast), enFirst = cut(p.enFirst);
  const legacy = cut(p.name);
  if (!last && !enLast && !legacy) return;
  let en = {};
  if (p.entries) en = normEntries(p.entries);
  else (p.arms || []).forEach(a => { if ((a === "R" || a === "L") && CLS.some(c => c[0] === p.cls)) en[a] = [p.cls]; });
  const keys = entryKeys(en);
  if (!keys.length) return;
  const latin = v => /^[\x00-\x7F]+$/.test(v);
  const full = last ? (first ? (latin(last) && latin(first) ? first + " " + last : last + " " + first) : last) : enLast ? (enFirst ? enFirst + " " + enLast : enLast) : legacy;
  const short = last || enLast || legacy;
  // 受付番号：サーバーが決めた番号があればそれを使う（あとから変わらない）。なければ仮の番号
  const sno = +p.no > 0 ? +p.no : 0;
  S.seq = sno ? Math.max(S.seq || 0, sno) : (S.seq || 0) + 1;
  S.players[p.pid] = { name: full, short, full, last, first, enLast, enFirst, kLast: cut(p.kLast), kFirst: cut(p.kFirst), dojo: String(p.dojo || "").trim().slice(0, 30), en, keys,
    no: sno || S.seq, pend: !sno, self: !!p.self, paid: p.paid || null, weighed: !!p.weighed, excluded: false };
  // 試合開始のあとに新しく登録した人：受付（入金・検量）が終わってから、まだ始まっていないクラスにだけ入る
  if (S.started){ S.players[p.pid].excluded = true; lateJoin(S, p.pid); return; }
  keys.forEach(k => { S.br[k].ent[p.pid] = { losses: 0, byes: 0, out: false, wd: false }; });
}

function apply(S, ev){
  switch (ev.type){
    case "add": addPlayer(S, ev); break;
    case "addMany": (ev.list || []).forEach(p => addPlayer(S, p)); break;
    case "edit": {
      // 登録の修正：名前はいつでも、クラスは試合開始の前だけ
      const p = S.players[ev.pid]; if (!p) return;
      const cut = v => String(v || "").trim().slice(0, 20);
      const last = cut(ev.last), first = cut(ev.first);
      if (last){
        const latin = v => /^[\x00-\x7F]+$/.test(v);
        p.last = last; p.first = first; p.short = last; p.kLast = cut(ev.kLast); p.kFirst = cut(ev.kFirst); p.dojo = String(ev.dojo || "").trim().slice(0, 30);
        p.full = first ? (latin(last) && latin(first) ? first + " " + last : last + " " + first) : last;
        p.name = p.full;
      }
      if (ev.entries){
        const en = normEntries(ev.entries);
        const keys = entryKeys(en);
        if (!keys.length) return;
        // 試合開始のあと：まだ1試合も始まっていないクラスどうしなら変更できる（組み合わせを作り直す）
        const changed = keys.filter(k => !p.keys.includes(k)).concat(p.keys.filter(k => !keys.includes(k)));
        if (p.excluded){ p.en = en; p.keys = keys; lateJoin(S, ev.pid); break; }
        if (S.started && changed.some(k => begun(S, k))) return;
        p.keys.forEach(k => delete S.br[k].ent[ev.pid]);
        p.en = en; p.keys = keys;
        keys.forEach(k => { S.br[k].ent[ev.pid] = { losses: 0, byes: 0, out: false, wd: false }; });
        if (S.started) changed.forEach(k => rebuild(S, k));
      }
      break;
    }
    case "remove": {
      const p = S.players[ev.pid]; if (!p) return;
      // 試合開始のあとは、まだトーナメントに入っていない人（受付が終わっていない人）だけ取り消せる
      if (S.started && !p.excluded) return;
      p.keys.forEach(k => delete S.br[k].ent[ev.pid]);
      delete S.players[ev.pid];
      break;
    }
    case "start": {
      S.started = true;
      // 受付（入金・検量）が終わっていない人は、トーナメントに入れない
      Object.keys(S.players).forEach(pid => { const p = S.players[pid]; if (!entryOK(p)){ p.excluded = true; p.keys.forEach(k => delete S.br[k].ent[pid]); } });
      break;
    }
    // 1人だけのクラスで「出ない」：その腕のエントリーを取り消して、差額を返金
    case "drop": {
      const p = S.players[ev.pid]; if (!p || !p.keys.includes(ev.k) || begun(S, ev.k)) return;
      const before = feeOf(p);
      const arm = ev.k.slice(ev.k.lastIndexOf("_") + 1), cls = ev.k.slice(0, ev.k.lastIndexOf("_"));
      delete S.br[ev.k].ent[ev.pid]; rebuild(S, ev.k);
      p.en[arm] = (p.en[arm] || []).filter(c => c !== cls); if (!p.en[arm].length) delete p.en[arm];
      p.keys = p.keys.filter(k => k !== ev.k);
      const after = p.keys.length ? feeOf(p) : 0;
      p.refund = (p.refund || 0) + (before - after);
      (p.dropped = p.dropped || []).push(ev.k);
      break;
    }
    // 1人だけのクラスを「このまま（試合なしで1位）」にする
    case "soloack": S.soloAck[ev.k] = true; break;
    case "pay": { const p = S.players[ev.pid]; if (!p) return; p.paid = ev.method === "paypay" ? "paypay" : "cash"; lateJoin(S, ev.pid); break; }
    case "unpay": { const p = S.players[ev.pid]; if (!p || (S.started && !p.excluded)) return; p.paid = null; break; }
    case "weigh": { const p = S.players[ev.pid]; if (!p) return; p.weighed = true; lateJoin(S, ev.pid); break; }
    case "unweigh": { const p = S.players[ev.pid]; if (!p || (S.started && !p.excluded)) return; p.weighed = false; break; }
    case "simulate": simulateAll(S, ev); break;
    case "autoassign": S.autoAssign = !!ev.on; break;
    case "claim": {
      // 運営が「このクラスをこの台でやる」と選んだ
      const k = ev.k, i = ev.table;
      if (!KEYS.includes(k) || !(i >= 0 && i < TABLES) || !used(S, k) || prelimDone(S.br[k])) return;
      if (!claimOK(S, k, i)) return;
      for (let j = 0; j < TABLES; j++) if (S.claim[j] === k) S.claim[j] = null;
      S.claim[i] = k;
      break;
    }
    case "order": if (Array.isArray(ev.order)){ const o = ev.order.filter(k => KEYS.includes(k)); DEFAULT_ORDER.forEach(k => { if (!o.includes(k)) o.push(k); }); S.order = o; } break;
    case "finals": if (S.started) S.finals = true; break;
    case "result": {
      const m = S.m[ev.mid];
      const w = S.fix[ev.id] != null ? S.fix[ev.id] : ev.w;
      // 組み合わせが変わっていたら（前の結果を直した影響）、この結果は使わない
      if (!m || m.st === "d" || (w !== m.a && w !== m.b) || (ev.a && !((ev.a === m.a && ev.b === m.b) || (ev.a === m.b && ev.b === m.a)))){ S.skipped++; return; }
      finish(S, m, w, ev.t, false);
      m.evId = ev.id; S.applied++;
      break;
    }
    case "withdraw": {
      const p = S.players[ev.pid]; if (!p) return;
      const keys = ev.k ? [ev.k] : p.keys;
      keys.forEach(k => {
        const b = S.br[k]; const e = b && b.ent[ev.pid];
        if (!e || e.out || b.champ) return;
        e.wd = true;
        const m = S.m.find(x => x.k === k && (x.st === "q" || x.st === "p") && (x.a === ev.pid || x.b === ev.pid));
        if (m) finish(S, m, m.a === ev.pid ? m.b : m.a, ev.t, true);
        if (!e.out){ e.losses = 2; e.out = true; if (b.elimRd[ev.pid] == null) b.elimRd[ev.pid] = e.losses && b.rounds.L.length ? b.rounds.L.length - 1 : -1; }
        if (!b.elim.includes(ev.pid) && b.champ !== ev.pid && b.second !== ev.pid) b.elim.push(ev.pid);
        if (b.ready && !b.hasF){ b.ready = false; b.third = null; }
      });
      break;
    }
  }
}

function finish(S, m, w, t, wd){
  m.st = "d"; m.w = w; m.wd = !!wd; m.te = t;
  if (m.table != null){ S.tables[m.table] = null; S.idle[m.table] = t; }
  const l = m.a === w ? m.b : m.a;
  const b = S.br[m.k];
  b.played[pk(m.a, m.b)] = 1;
  const who = p => (S.players[p] ? S.players[p].full : p);
  S.lastEnd[who(w)] = t; S.lastEnd[who(l)] = t;
  const el = b.ent[l], ew = b.ent[w];
  if (m.pool === "W" || m.pool === "L"){
    el.losses = wd ? 2 : el.losses + 1;
    if (el.losses >= 2 && !el.out){ el.out = true; b.elim.push(l); b.elimRd[l] = m.pool === "L" ? m.rd : -1; }
  } else {
    if (m.pool === "F" && !wd && el.losses === 0 && ew.losses === 1){
      el.losses = 1;
      const nm = { id: S.m.length, k: m.k, pool: "F2", a: m.a, b: m.b, st: "q", table: null, w: null, t0: t };
      S.m.push(nm); S.finalOrder.push(nm.id);
    } else {
      el.losses = 2; el.out = true;
      b.champ = w; b.second = l;
    }
  }
}

// テスト用：決勝まで全部ランダムで終わらせる（記録は1件だけ）
function simulateAll(S, ev){
  if (!S.started) return;
  const rng = rngFrom(hstr("sim" + ev.id));
  S.autoAssign = true; assign(S);
  for (let i = 0; i < 5000; i++){
    let m = S.m.find(x => x.st === "p") || S.m.find(x => x.st === "q" && (x.pool === "W" || x.pool === "L"))
      || S.finalOrder.map(j => S.m[j]).find(x => x.st !== "d");
    if (!m){
      if (!S.finals){ S.finals = true; post(S, { id: ev.id + "f" + i, t: ev.t }); continue; }
      break;
    }
    finish(S, m, rng() < 0.5 ? m.a : m.b, ev.t + i * 0.001, false);
    post(S, { id: ev.id + "_" + i, t: ev.t + i * 0.001 });
  }
}

function post(S, ev){
  if (!S.started) return;
  const rng = rngFrom(hstr(String(ev.id)));
  KEYS.forEach(k => pair(S, S.br[k], rng, ev.t));
  if (S.finals){
    KEYS.forEach(k => {
      const b = S.br[k];
      if (b.ready && !b.hasF && !b.champ){
        const alive = Object.keys(b.ent).filter(p => !b.ent[p].out);
        alive.sort((x, y) => b.ent[x].losses - b.ent[y].losses);
        const nm = { id: S.m.length, k, pool: "F", a: alive[0], b: alive[1], st: "q", table: null, w: null, t0: ev.t };
        S.m.push(nm); S.finalOrder.push(nm.id); b.hasF = true;
      }
    });
  }
  assign(S);
}

function pair(S, b, rng, t){
  if (b.champ || b.ready) return;
  const ids = Object.keys(b.ent); if (!ids.length) return;
  const alive = ids.filter(p => !b.ent[p].out);
  const W = alive.filter(p => b.ent[p].losses === 0);
  const L = alive.filter(p => b.ent[p].losses === 1);
  const act = S.m.filter(m => m.k === b.k && (m.st === "q" || m.st === "p"));
  const aW = act.filter(m => m.pool === "W").length;
  const aL = act.filter(m => m.pool === "L").length;
  if (!aW && !aL){
    if (alive.length === 1){
      b.champ = alive[0];
      b.second = b.elim[b.elim.length - 1] || null;
      b.third = b.elim[b.elim.length - 2] || null;
      return;
    }
    if (alive.length === 2 && W.length <= 1){
      b.ready = true; b.third = b.elim[b.elim.length - 1] || null; return;
    }
    if (!alive.length) return;
  }
  const wBusy = aW > 0;
  if (!aW && W.length >= 2) makeRound(S, b, W, "W", rng, t);
  if (!aL && !wBusy && L.length >= 2) makeRound(S, b, L, "L", rng, t);
}

function makeRound(S, b, ids, pool, rng, t){
  const R = b.rounds[pool];
  let arr;
  if (pool === "W" && R.length){
    // 前の回戦の並び順のまま勝ち上がった人を並べる（トーナメント表の形になるように）
    arr = [];
    R[R.length - 1].forEach(it => { const p = it.bye || S.m[it.mid].w; if (ids.includes(p) && !arr.includes(p)) arr.push(p); });
    ids.forEach(p => { if (!arr.includes(p)) arr.push(p); });
  } else if (pool === "W"){
    arr = shuffle(ids, rng);
  } else {
    arr = null;
  }
  let pool2 = arr ? arr.slice() : ids.slice();
  let byeP = null, byePos = 0;
  if (pool2.length % 2){
    // 直前に不戦勝だった人は、ほかに候補がいれば外す
    const last = b.byes.length ? b.byes[b.byes.length - 1].p : null;
    const base = pool2.length > 1 ? pool2.filter(p => p !== last) : pool2;
    const mn = Math.min(...base.map(p => b.ent[p].byes));
    const c = base.filter(p => b.ent[p].byes === mn);
    byeP = c[Math.floor(rng() * c.length)];
    b.ent[byeP].byes++; b.byes.push({ p: byeP, pool, t });
    byePos = pool2.indexOf(byeP);
    pool2 = pool2.filter(p => p !== byeP);
  }
  // 組み合わせの「よくなさ」：同じ道場どうし（3点）・前に当たった人どうし（2点）。これが一番小さい組み方を選ぶ
  const dj = p => dojoKey(S.players[p] && S.players[p].dojo);
  const pc = (x, y) => (dj(x) && dj(x) === dj(y) ? 3 : 0) + (b.played[pk(x, y)] ? 2 : 0);
  const cost = a => { let c = 0; for (let j = 0; j + 1 < a.length; j += 2) c += pc(a[j], a[j + 1]); return c; };
  // 入れ替えで少しずつよくする（並びはなるべく崩さない）
  const improve = a => {
    a = a.slice();
    for (let it = 0; it < 60; it++){
      let bestGain = 0, bi = -1, bj = -1;
      for (let i = 0; i + 1 < a.length; i += 2){
        const ci = pc(a[i], a[i + 1]); if (!ci) continue;
        for (let j = 0; j < a.length; j++){
          if (j === i || j === i + 1) continue;
          const pj = j % 2 ? j - 1 : j + 1; // j の相手
          const before = ci + pc(a[j], a[pj]);
          const after = pc(a[i], a[j]) + pc(a[i + 1], a[pj]);
          const gain = before - after;
          if (gain > bestGain){ bestGain = gain; bi = i + 1; bj = j; }
        }
      }
      if (bi < 0) break;
      [a[bi], a[bj]] = [a[bj], a[bi]];
    }
    return a;
  };
  let best = pool2;
  if (!(pool === "W" && R.length)){
    // 1回戦と敗者復活戦：たくさんの並べ方を試して、いちばんよいものを選ぶ
    let bs = 1e9;
    for (let i = 0; i < 300; i++){
      const sh = improve(i === 0 && arr ? pool2 : shuffle(pool2, rng)); const c = cost(sh);
      if (c < bs){ bs = c; best = sh; }
      if (!c) break;
    }
  } else {
    // 2回戦以降の本戦：トーナメント表の並びのまま、必要なところだけ入れ替える
    best = improve(pool2);
  }
  const round = [];
  for (let j = 0; j < best.length; j += 2){
    const m = { id: S.m.length, k: b.k, pool, a: best[j], b: best[j + 1], st: "q", table: null, w: null, t0: t, rd: R.length };
    S.m.push(m); round.push({ mid: m.id });
  }
  if (byeP) round.splice(Math.min(round.length, arr ? Math.floor(byePos / 2) : round.length), 0, { bye: byeP });
  R.push(round);
}

function prelimDone(b){ return b.ready || !!b.champ || !Object.keys(b.ent).length; }
function used(S, k){ return Object.keys(S.br[k].ent).length > 0; }
function otherArm(k){ const i = k.lastIndexOf("_"); return k.slice(0, i) + "_" + (k.slice(i + 1) === "R" ? "L" : "R"); }
// このトーナメントを始めてよいか：右は同じクラスの左が終わってから。同じクラスの右と左は同時にやらない
function canStart(S, k){
  if (k.endsWith("_R") && used(S, otherArm(k)) && !prelimDone(S.br[otherArm(k)])) return false;
  if (S.tableKey.includes(otherArm(k))) return false;
  return true;
}
// 運営が選んでよいクラスか（右は同じクラスの左が終わってから、同じクラスの右と左は同時にやらない）
function claimOK(S, k, i){
  if (k.endsWith("_R") && used(S, otherArm(k)) && !prelimDone(S.br[otherArm(k)])) return false;
  const o = otherArm(k);
  for (let j = 0; j < TABLES; j++){ if (S.claim[j] === o || S.tableKey[j] === o) return false; }
  return true;
}
function claimBlock(S, k){
  if (!used(S, k)) return "出場者なし";
  if (prelimDone(S.br[k])) return "終わり";
  if (k.endsWith("_R") && used(S, otherArm(k)) && !prelimDone(S.br[otherArm(k)])) return "同じクラスの左が終わってから";
  const o = otherArm(k);
  for (let j = 0; j < TABLES; j++){ if (S.claim[j] === o || S.tableKey[j] === o) return "同じクラスの" + (o.endsWith("_L") ? "左" : "右") + "が試合中"; }
  return "";
}
function waitingKeys(S){ return S.order.filter(k => used(S, k) && !prelimDone(S.br[k]) && !S.tableKey.includes(k)); }

function waitKey(S, m){ const le = p => { const k = S.players[p] ? S.players[p].full : p; return S.lastEnd[k] == null ? -1 : S.lastEnd[k]; }; return Math.max(le(m.a), le(m.b)); }
function queueList(S){
  return S.m.filter(m => m.st === "q" && (m.pool === "W" || m.pool === "L"))
    .sort((x, y) => waitKey(S, x) - waitKey(S, y) || x.id - y.id);
}
function assign(S){
  // 同じ名前の人（ダブルエントリーで2回登録した人）は同じ人として、2つの台で同時に呼ばない
  const who = p => (S.players[p] ? S.players[p].full : p);
  const busy = { s: new Set(), has(p){ return this.s.has(who(p)); }, add(p){ this.s.add(who(p)); } };
  S.m.forEach(m => { if (m.st === "p"){ busy.add(m.a); busy.add(m.b); } });
  // 長く待っている台から先に試合を入れる（同じ人を取り合ったとき、待っていた台を優先）
  const order = Array.from({ length: TABLES }, (_, i) => i).sort((x, y) => (S.idle[x] || 0) - (S.idle[y] || 0) || x - y);
  for (const i of order){
    if (S.tables[i] != null) continue;
    let k;
    if (S.claim[i] && prelimDone(S.br[S.claim[i]])) S.claim[i] = null;
    if (S.claim[i]){ k = S.claim[i]; S.tableKey[i] = k; }
    else {
      k = S.tableKey[i];
      if (!k || prelimDone(S.br[k]) || S.claim.includes(k)){
        S.tableKey[i] = null;
        k = S.autoAssign ? (waitingKeys(S).find(x => canStart(S, x) && !S.claim.includes(x)) || null) : null;
        S.tableKey[i] = k;
      }
    }
    if (!k) continue;
    const m = S.m.filter(m => m.k === k && m.st === "q" && (m.pool === "W" || m.pool === "L"))
      .sort((x, y) => waitKey(S, x) - waitKey(S, y) || x.id - y.id)
      .find(m => !busy.has(m.a) && !busy.has(m.b));
    if (m){ m.st = "p"; m.table = i; S.tables[i] = m.id; busy.add(m.a); busy.add(m.b); }
  }
}
function tableQueue(S, i){
  const k = S.tableKey[i]; if (!k) return [];
  return S.m.filter(m => m.k === k && m.st === "q" && (m.pool === "W" || m.pool === "L"))
    .sort((x, y) => waitKey(S, x) - waitKey(S, y) || x.id - y.id);
}
// 順位：まだ残っている人より下、同じ回戦で負けた人どうしは同率
function rankOf(S, b, p){
  if (b.champ === p) return { r: 1, tie: false };
  if (b.second === p) return { r: 2, tie: false };
  const e = b.ent[p]; if (!e || !e.out) return null;
  const ids = Object.keys(b.ent);
  const alive = ids.filter(x => !b.ent[x].out).length;
  const others = ids.filter(x => b.ent[x].out && x !== b.second);
  const rd = x => (b.elimRd[x] == null ? -1 : b.elimRd[x]);
  const r = 1 + alive + (b.second ? 1 : 0) + others.filter(x => rd(x) > rd(p)).length;
  const tie = others.filter(x => x !== p && rd(x) === rd(p)).length > 0;
  return { r, tie };
}
function record(S, k, p){
  let w = 0, l = 0;
  S.m.forEach(m => { if (m.k === k && m.st === "d" && (m.a === p || m.b === p)){ if (m.w === p) w++; else l++; } });
  return { w, l };
}

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]); }
async function flush(){

// ---------- Google（スプレッドシート）とのやりとり ----------
// GitHubの入口から開いたとき（window.AW_API がある）は、裏口（fetch）でGoogleの係とやりとりする
function gasCall(fn, ...args){
  if (window.AW_API){
    const u = window.AW_API;
    if (fn === "putEvents") return fetch(u, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, list: args[0], pass: args[1] }) }).then(r => r.json());
    if (fn === "getEvents") return fetch(u + "?fn=getEvents&from=" + (+args[0] || 0)).then(r => r.json());
    if (fn === "checkPass") return fetch(u + "?fn=checkPass&pass=" + encodeURIComponent(args[0] || "")).then(r => r.json());
    return Promise.reject(new Error("unknown"));
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
let polling = false;
async function flushGas(){
  if (flushing || !outbox.length) return;
  const batch = outbox.filter(e => !sentIds.has(e.id)); if (!batch.length) return;
  flushing = true;
  try {
    const r = await withTimeout(gasCall("putEvents", batch, ui.pass || ""), 30000);
    (r.ok || []).forEach(id => sentIds.add(id));
    if (r.bad && r.bad.length){
      const bad = new Set(r.bad); outbox = outbox.filter(e => !bad.has(e.id)); saveOutbox(); mergeEvs();
      if (ui.role === "staff"){ ui.pass = ""; try { localStorage.removeItem("aw_pass"); } catch (e) {} }
      toast("保存できませんでした。パスコードを確かめてください");
    }
    flushing = false;
    await poll();
  } catch (e){ flushing = false; setTimeout(flush, 5000); }
  render();
}
async function poll(){
  if (mode !== "gas" || polling) return;
  polling = true;
  try {
    const r = await withTimeout(gasCall("getEvents", serverEvs.length), 20000);
    const before = serverEvs.length;
    serverEvs = (r.from === 0 ? [] : serverEvs).concat(r.evs || []);

    else if (serverEvs.length !== before || r.from === 0){ mergeEvs(); render(); }

  polling = false;
}

// 担当するクラスを選ぶ
function viewClassPick(){
  const list = S.order.filter(k => used(S, k));

  const fixed = ui.fixedTable;
  let h = `<div class="hero" style="text-align:left"><p class="big" style="text-align:center">あなたが担当するクラスを<br>選んでください</p>

  if (!list.length) h += `<div class="card center sub">まだ出場者が登録されていません</div>`;
  h += list.map(k => {
    const blk = claimBlock(S, k), where = S.claim.indexOf(k) >= 0 ? S.claim.indexOf(k) : S.tableKey.indexOf(k);
    const running = where >= 0;
    // 選べるのは「次はこれ」のクラスと、試合中のクラス（引き継ぎ用）だけ
    const dis = !(k === rec || running) || (fixed != null && running && where !== fixed);
    const n = Object.keys(S.br[k].ent).length;
    const endTxt = n <= 1 ? (soloKeys(S).includes(k) ? "1人だけ（本部が相談中）" : "1人だけなので試合なし") : n === 2 && !S.m.some(m => m.k === k && m.st === "d" && m.pool !== "F" && m.pool !== "F2") ? "2人だけなので決勝だけ" : "終わり（あとは決勝）";
    const st = blk === "終わり" ? `<span class="os done">${endTxt}</span>` : running ? `<span class="os now">${TNAME[where]}で試合中</span>` : blk ? `<span class="os done">${blk}</span>` : k === rec ? `<span class="os rec">次はこれ</span>` : `<span class="os done">順番待ち</span>`;
    return `<button class="cpick ${k === rec ? "rec" : ""}" data-a="pickcls" data-v="${k}" ${dis ? "disabled" : ""}><b>${esc(keyLabel(k))}</b><span class="sm">${Object.keys(S.br[k].ent).length}人</span>${st}</button>`;
  }).join("");
  h += `<p class="sub center" style="margin-top:12px">選べるのは「次はこれ」のクラスだけです（試合中のクラスは引き継ぎのときに選べます）。</p>`;

// 担当する台を選ぶ
function viewTablePick(){
  const k = ui.pendKey;

  if (done.length) h += `<div class="card"><div class="lbl">この台の最近の結果（まちがえたら「修正する」）</div>${done.map(m => resultRow(m, true)).join("")}</div>`;

// 台が空いているのに試合が入らない理由
function waitReason(i, k){
  const q = tableQueue(S, i).filter(m => m.k === k);
  const who = p => S.players[p] ? S.players[p].full : p;
  const busyAt = p => { const m = S.m.find(x => x.st === "p" && [x.a, x.b].some(y => who(y) === who(p))); return m ? m : null; };
  if (q.length){
    const m = q[0]; const bm = busyAt(m.a) || busyAt(m.b);
    if (bm){ const p = [m.a, m.b].find(y => busyAt(y)); return `<p class="sub">次の試合「${nm(m.a, m.k)} vs ${nm(m.b, m.k)}」の<b>${esc(who(p))}</b>さんが、いま${TNAME[bm.table]}で${esc(keyLabel(bm.k))}の試合中です。<br>その試合が終わると、自動でこの台に入ります。</p>`; }
    return "";
  }
  return `<p class="sub">このクラスのほかの試合が終わると、次の組み合わせが自動で決まります。</p>`;
}
function resultRow(m, withFix){
  const l = m.w === m.a ? m.b : m.a;
  return `<div class="row"><span class="grow"><b>○ ${nm(m.w, m.k)}</b> <span class="sm">vs</span> <span class="lose">${nm(l, m.k)}</span>${m.wd ? " <em>棄権</em>" : ""}<br><span class="sm">${esc(keyLabel(m.k))}・${POOL[m.pool]}</span></span>
    ${withFix && !m.wd && m.evId && isStaff() ? `<button class="x" data-a="fix" data-mid="${m.id}">修正する</button>` : ""}</div>`;
}

function startFix(m){

  const l = m.w === m.a ? m.b : m.a;
  choose(`<b>${esc(keyLabel(m.k))}・${POOL[m.pool]}</b><br>いまは <b>${nm(m.w, m.k)}</b> さんの勝ちになっています。<br>正しい勝者を選んでください。`, [

function confirmFix(m, w){
  const test = replay(evs.concat([{ id: "zz_test", t: lastT + 1, type: "fix", target: m.evId, w }]));
  const lost = S.applied - test.applied;
  const msg = `<b>${nm(w, m.k)}</b> さんの勝ちに修正しますか？` + (lost > 0
    ? `<br><br><b class="red">この試合のあとに入力された ${lost} 試合の結果が取り消されます。</b><br><small>組み合わせが変わるため、その試合はもう一度行う必要があります。</small>`
    : "");
  ask(msg, "修正する", () => push({ type: "fix", target: m.evId, mid: m.id, w }));
}

// ---------- 受付：入金と検量 ----------
function startPay(pid){
  const pl = S.players[pid]; if (!pl) return;
  if (entryOK(pl)) return toast(`No.${noOf(pl)} ${pl.full}さんは、もうエントリー完了です`);
  if (pl.paid && !(needWeigh(pl) && !pl.weighed)) return toast("入金済みです");
  // −75の人は、検量のあとにお支払い
  if (needWeigh(pl) && !pl.weighed) return askWeigh(pid);
  choose(`<div class="paybox"><div class="sub">受付番号 ${noOf(pl)}</div><b>${rubyName(pl, true)}</b> さん<br><span class="sm">${esc(entryText(pl))}</span>
    <div class="payamt">${handOf(pl)}　${feeOf(pl).toLocaleString()}円</div>お金を受け取りましたか？</div>`, [
    { label: "お金を受け取りました", cls: "main", fn: () => { push({ type: "pay", pid, method: "cash" }); setTimeout(() => showDone(pid), 30); } },
  ]);
}
// エントリー完了：自分で「次へ」を押すまで消えない画面
function showDone(pid){
  const pl = S.players[pid]; if (!pl) return;
  choose(`<div class="paybox"><div class="donemark">✓</div><div class="donettl">エントリー完了しました</div>
    <div class="sub">受付番号 ${noOf(pl)}</div><b class="big2">${rubyName(pl, true)} さん</b><br><span class="sm">${esc(entryText(pl))}</span>
    <div class="sub" style="margin-top:8px">${handOf(pl)} ${feeOf(pl).toLocaleString()}円　受け取り済み</div></div>`, [
    { label: "次の人の受付へ（出場登録に戻る）", cls: "go", fn: () => { ui.recMode = null; ui.f.f_search = ""; ui.q = ""; ui.skipCapture = true; window.scrollTo(0, 0); render(); } },
  ], true);
}
function askWeigh(pid){
  const pl = S.players[pid]; if (!pl) return;
  const lc = pl.keys.filter(k => k.startsWith("S-75_") || k.startsWith("C-75_")).map(keyLabel).join("・");
  choose(`<div class="paybox"><div class="sub">受付番号 ${noOf(pl)}　検量</div><b>${rubyName(pl, true)}</b> さん<br><span class="sm">${esc(entryText(pl))}</span>
    <div class="payamt" style="color:var(--navy)">${esc(lc)}</div>検量（体重の確認）はパスしましたか？</div>`, [
    { label: "はい、パスしました", cls: "main", fn: () => { push({ type: "weigh", pid }); setTimeout(() => startPay(pid), 50); } },
    { label: "いいえ（体重オーバー）", cls: "ghost red2", fn: () => weighFail(pid) },
  ]);
}
// 検量に失敗：−75 → 同じクラスの +75 へ
function weighFail(pid){
  const pl = S.players[pid]; if (!pl) return;
  const entries = { L: (pl.en.L || []).slice(), R: (pl.en.R || []).slice() };
  const moved = [];
  ["L","R"].forEach(a => { entries[a] = entries[a].map(c => { if (c === "S-75" || c === "C-75"){ const n = c.replace("-75", "+75"); moved.push(n); return n; } return c; }); });
  const toCls = [...new Set(moved)].map(clsLabel).join("・");
  const newText = ["L","R"].filter(a => entries[a].length).map(a => armLabel(a) + "：" + entries[a].map(clsLabel).join("・")).join("　");
  choose(`<div class="paybox"><b>${rubyName(pl, true)}</b> さんは −75 に出られません。<br><br><b class="big2">${esc(toCls)} にエントリーしますか？</b><br><span class="sm">変更後：${esc(newText)}</span></div>`, [
    { label: `はい、${toCls} にする`, cls: "main", fn: () => {
      push({ type: "edit", pid, last: pl.last, first: pl.first, kLast: pl.kLast, kFirst: pl.kFirst, dojo: pl.dojo, entries });
      toast(toCls + " に変更しました"); setTimeout(() => startPay(pid), 50);
    } },
    { label: "クラスを選び直す", cls: "ghost", fn: () => { ui.tab = "entry"; ui.payAfterEdit = pid; act("edit", { pid, toArm: 1 }); } },
    { label: "出場しない（登録を取り消す）", cls: "ghost red2", fn: () => cancelEntry(pid) },
  ]);
}
// 出場をやめる人：お金は受け取らずに登録を取り消す
function cancelEntry(pid){
  const pl = S.players[pid]; if (!pl) return;
  ask(`<b>${rubyName(pl, true)}</b> さんの登録を取り消しますか？<br><small>お金は受け取りません。出場者の一覧から消えます。</small>`, "取り消す", () => { push({ type: "remove", pid }); toast("登録を取り消しました"); });
}
function footer(){
  if (mode === "loading" || !ui.role) return "";
  let h = `<footer class="foot">`;
  if (isDesk()) h += `<button class="btn sm2" data-a="pickmode" data-v="table">担当を変える</button>`;
  h += `<button class="btn sm2" data-a="role" data-v="">トップページに戻る</button>`;
  if (ui.role === "staff") h += `<button class="btn sm2 help" data-a="help">困ったとき</button>`;
  h += `<button class="btn sm2 refresh" data-a="refresh">⟳ 更新</button>`;
  if (isAdmin()) h += `<button class="btn sm2 danger" data-a="reset">全部リセット（テスト用）</button>`;
  return h + `<div class="ver">画面の版：${APP_VER}</div></footer>`;
}
function modal(){
  // お知らせ（toast）は別の場所に出して、画面全体を書き直さない（押している途中のボタンが消えないように）
  const tEl = document.getElementById("toastbox");
  if (tEl){ const th = note ? `<div class="toast">${esc(note)}</div>` : ""; if (tEl.innerHTML !== th) tEl.innerHTML = th; }
  let h = "";
  if (!modalBtns) return h;
  // ボタンが3つ以上（縦に並ぶ）ときは「やめる」をいちばん下に。2つのときは左に「やめる」
  const many = modalBtns.length > 2;
  const btns = modalBtns.slice().sort((a, b) => many ? (a.fn ? 0 : 1) - (b.fn ? 0 : 1) : (a.fn ? 1 : 0) - (b.fn ? 1 : 0));
  return h + `<div class="ov"><div class="md"><p>${modalText}</p><div class="mb ${btns.length > 2 ? "col2" : ""}">${btns.map(b => `<button class="btn ${b.cls}" data-a="mbtn" data-i="${modalBtns.indexOf(b)}">${b.label}</button>`).join("")}</div></div></div>`;
}

// 待っていた台に試合が入ったら、しばらく光らせて知らせる
// （本当に3秒以上待っていたときだけ。読み込み直後や、自分で結果を入れた直後は光らせない）
function trackDesk(){
  if (!isDesk() || !dataReady) return;
  const i = ui.desk, cur = S.tables[i] != null && S.m[S.tables[i]].k === ui.deskKey ? S.tables[i] : null;
  const now = Date.now();
  if (ui.deskSeenTable !== i){ ui.deskSeenTable = i; ui.deskSeen = cur; ui.nullSince = cur == null ? now : null; return; }
  if (cur == null){ if (ui.deskSeen != null || ui.nullSince == null) ui.nullSince = now; }
  else if (ui.deskSeen == null && ui.nullSince != null && now - ui.nullSince > 3000 && now - (ui.lastPush || 0) > 3000){
    ui.flashUntil = now + 5000; setTimeout(render, 5100);
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  // この台に新しい試合が入ったら、画面をいちばん上（いまの試合）に戻す
  if (cur != null && cur !== ui.deskSeen) ui.scrollTop = true;
  ui.deskSeen = cur;
}
function render(){
  trackDesk();
  const app = document.getElementById("app");
  const FIELDS = ["f_last","f_first","f_klast","f_kfirst","f_dojo","f_search","f_pass"];
  if (ui.skipCapture) ui.skipCapture = false;
  else FIELDS.forEach(id => { const el = document.getElementById(id); if (el) ui.f[id] = el.value; });
  const foc = document.activeElement && FIELDS.includes(document.activeElement.id) ? document.activeElement.id : null;
  let body;
  if (mode === "loading") body = '<div class="card center sub">読み込み中…</div>';
  else if (!ui.role) body = viewRole();
  else if (ui.role === "staff" && mode === "gas" && !ui.pass) body = viewPass();   // 運営は、本部も台の担当も、まずパスコード
  else if (ui.role === "staff" && ui.desk == null && ui.step === "class") body = viewClassPick();
  else if (ui.role === "staff" && ui.desk == null && ui.step === "table") body = viewTablePick();
  else if (ui.role === "staff" && ui.desk == null) body = viewDeskPick();
  else body = null;
  if (ui.help && body == null) body = viewHelp();
  // 中身が変わらないときは書き直さない（ほかの端末からの更新で、押しかけたボタンが消えないように）
  const put = html => { if (html !== ui.lastHtml){ ui.lastHtml = html; app.innerHTML = html; } };
  if (body != null) put(header() + practiceBan() + `<main>${body}</main>` + modal());
  else {
    const t = tabs();
    const v = ui.tab === "desk" ? viewDesk() : ui.tab === "self" ? viewSelfEntry() : ui.tab === "match" ? viewMatch() : ui.tab === "class" ? viewClass() : viewEntry();
    put(header() + banners() + t + `<main>${v}</main>` + footer() + modal());
  }
  FIELDS.forEach(id => { const el = document.getElementById(id); if (el) el.value = ui.f[id] || ""; });
  if (document.getElementById("f_dojo")) markDojo();
  if (foc){ const el = document.getElementById(foc); if (el){ el.focus(); try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) {} } }
  if (ui.scrollTop && ui.tab === "desk" && !modalBtns){ ui.scrollTop = false; window.scrollTo(0, 0); }
  // 画面（役割・担当・タブ・選ぶ画面）が切り替わったら、必ずいちばん上から見せる
  const vk = [ui.role, ui.desk, ui.deskKey, ui.step, ui.tab, ui.help ? 1 : 0, mode].join("|");
  if (vk !== ui.lastView){ ui.lastView = vk; window.scrollTo(0, 0); }
}
function viewMatch(){
  let h = "";
  const np = Object.keys(S.players).length;
  if (!S.started){
    h += `<div class="card center"><p class="big">まだ試合は始まっていません</p><p>受付済み：${np}人</p>
      ${isAdmin() ? `<p class="sub">「出場登録」タブで選手を登録してから、試合開始を押してください。</p>` : ""}</div>`;
    return h;
  }
  // 決勝
  const oi = k => S.order.indexOf(k);
  const fins = S.finalOrder.map(i => S.m[i]).sort((x, y) => oi(x.k) - oi(y.k) || x.id - y.id);
  const curF = fins.find(m => m.st !== "d");
  if (S.finals){
    h += `<h2>決勝</h2>`;
    if (curF) h += matchCard(curF, "いまの決勝");
    else if (fins.length) h += `<div class="card center sub">決勝待ちの試合はありません</div>`;
    const waitF = fins.filter(m => m.st !== "d" && m !== curF);
    if (waitF.length) h += `<div class="card"><div class="lbl">このあとの決勝</div>${waitF.map(m => `<div class="row"><span>${esc(keyLabel(m.k))}</span><span>${nm(m.a, m.k)} vs ${nm(m.b, m.k)}</span></div>`).join("")}</div>`;
  }
  // 台（クラスごとに担当）
  const anyPrelim = KEYS.some(k => Object.keys(S.br[k].ent).length && !prelimDone(S.br[k]));
  if (anyPrelim){
    h += `<h2>予選</h2>`;
    // 選手・観客の画面では、いま試合をしている台だけ出す
    if (!isAdmin() && !S.tables.some(x => x != null)) h += `<div class="card center sub">いま試合中の台はありません。次の試合が始まるまでお待ちください。</div>`;
    for (let i = 0; i < TABLES; i++){
      const mid = S.tables[i], c = S.tableKey[i];
      if (!isAdmin() && mid == null) continue;
      h += `<div class="tg"><div class="th"><b>${TNAME[i]}</b>${c ? `<span class="tk">${esc(keyLabel(c))}</span>` : `<span class="sm">${isAdmin() ? "クラス未選択" : "準備中"}</span>`}${isAdmin() ? `<button class="x2 thb" data-a="hqpick" data-v="${i}">クラスを選ぶ</button>` : ""}</div>`;
      h += mid == null ? `<div class="mc empty"><div class="sub center" style="padding-top:12px">${isAdmin() ? "空き" : "次の試合の準備中"}</div>${c && !prelimDone(S.br[c]) ? `<div class="center" style="padding:0 12px">${waitReason(i, c)}</div>` : ""}</div>` : matchCard(S.m[mid], "いまの試合");
      const q = tableQueue(S, i);
      if (q.length) h += `<div class="nx"><span class="sm">次</span>${q.slice(0, 2).map(m => `<span>${nm(m.a, m.k)} vs ${nm(m.b, m.k)}<small>${esc(keyLabel(m.k))}・${POOL[m.pool]}</small></span>`).join("")}</div>`;
      h += `</div>`;
    }
  }
  // 決勝開始ボタン
  const used = KEYS.filter(k => Object.keys(S.br[k].ent).length);
  const rd = used.filter(k => S.br[k].ready || S.br[k].champ).length;
  if (!S.finals){
    // 決勝は、全クラスの予選が終わってから
    const allDone = used.length && rd === used.length;
    h += `<div class="card center"><p>予選が終わったクラス：${rd} / ${used.length} クラス</p>
      ${isAdmin() ? (allDone ? `<button class="btn main" data-a="finals">決勝を始める</button>`
        : `<button class="btn main" disabled>決勝を始める</button><p class="sub">全クラスの予選が終わると押せるようになります（あと${used.length - rd}クラス）。</p>`) : ""}</div>`;
  }
  if (isAdmin()){
    const done = S.m.filter(m => m.st === "d").sort((x, y) => (y.te || 0) - (x.te || 0)).slice(0, 8);
    if (done.length) h += `<div class="card"><div class="lbl">最近の結果（まちがえたら「修正する」）</div>${done.map(m => resultRow(m, true)).join("")}
      <div class="sub" style="margin-top:6px">もっと前の結果は「トーナメント表」のタブから修正できます。</div></div>`;
  }
  if (isAdmin()) h += `<div class="card center"><button class="btn ghost" data-a="sim">テスト用：決勝まで全部ランダムで終わらせる</button></div>`;
  return h;
}

// ---------- 大会の結果を書き出す ----------
function plainName(p){ const pl = S.players[p]; return pl ? pl.full + (pl.dojo ? "（" + pl.dojo + "）" : "") : "?"; }
function resultsText(all){
  let t = "第3回 関谷塾杯 結果\n";
  S.order.filter(k => used(S, k)).forEach(k => {
    const b = S.br[k]; t += "\n【" + keyLabel(k) + "】\n";
    if (!b.champ){ t += "（まだ終わっていません）\n"; return; }
    const rows = Object.keys(b.ent).map(p => ({ p, r: rankOf(S, b, p), rc: record(S, k, p) })).filter(x => x.r).sort((x, y) => x.r.r - y.r.r);
    rows.filter(x => all || x.r.r <= 3).forEach(x => { t += (x.r.tie ? "同率" : "") + x.r.r + "位　" + plainName(x.p) + (all ? "　" + (x.rc.w + x.rc.l) + "戦" + x.rc.w + "勝" + x.rc.l + "敗" : "") + "\n"; });
  });
  return t;
}
// 大会の結果を書き出す：全クラスの順位が決まったら、トーナメント表のいちばん下に出す（本部だけ）
function resultsCard(){
  const used_ = KEYS.filter(k => used(S, k)); if (!used_.length || !S.started || !isAdmin()) return "";
  if (used_.some(k => !S.br[k].champ)) return "";
  return `<div class="card"><div class="lbl">大会の結果を書き出す</div>
    <p class="sub">全クラスの順位が決まりました。LINEやSNSに貼れる文章をコピーできます。</p>
    <div class="mb"><button class="btn ghost" data-a="copyres" data-v="top">表彰（1〜3位）をコピー</button><button class="btn ghost" data-a="copyres" data-v="all">全員の順位をコピー</button></div>
    ${ui.resText ? `<textarea class="restext" readonly>${esc(ui.resText)}</textarea><p class="sub">うまくコピーできないときは、上の文章を長押しして選んでコピーしてください。</p>` : ""}</div>`;
}

function statusOf(b){
  if (!Object.keys(b.ent).length) return ["", "出場者なし"];
  if (b.champ) return ["done", "終了"];
  if (b.hasF) return ["fin", "決勝"];
  if (b.ready) return ["ready", "決勝待ち"];
  if (!S.started) return ["none", "受付中"];
  return begun(S, b.k) ? ["go", "予選中"] : ["none", "順番待ち"];
}

function viewClass(){ return viewClassBody() + resultsCard(); }
function viewClassBody(){
  let h = `<div class="guide">クラスを選択してください</div>
    <div class="legend"><span><i class="dot go"></i>予選中</span><span><i class="dot ready"></i>決勝待ち・決勝中</span><span><i class="dot done"></i>終了（順位が決定）</span><span><i class="dot none"></i>まだ始まっていない</span></div>
    <div class="chips">${KEYS.map(k => { const b = S.br[k]; const n = Object.keys(b.ent).length; const s = statusOf(b);
    return `<button data-a="br" data-v="${k}" class="chip ${ui.br === k ? "on" : ""} ${n ? "" : "dim"}"><span class="dot ${s[0]}"></span>${esc(keyLabel(k))}<small>${n}人</small></button>`; }).join("")}</div>`;
  const b = S.br[ui.br]; const ids = Object.keys(b.ent);
  const s = statusOf(b);
  h += `<div class="card"><div class="bh"><b>${esc(keyLabel(ui.br))}</b><span class="st ${s[0]}">${s[1]}</span></div>`;
  if (!ids.length){ return h + `<p class="sub">このクラスの出場者はまだいません。</p></div>`; }
  h += `</div>`;
  if (!S.started){ return h + `<div class="card sub center">試合が始まるとトーナメント表が出ます。</div>`; }
  h += bracketView(b, "W") + bracketView(b, "L");
  const fins = S.m.filter(m => m.k === b.k && (m.pool === "F" || m.pool === "F2"));
  if (fins.length || b.ready){
    h += `<div class="card"><div class="lbl">決勝</div><div class="bk"><div class="col"><div class="its">${fins.map(m => box(m)).join("") || '<div class="sub">決勝待ち（最後にまとめて行います）</div>'}</div></div></div>
      <div class="sub">敗者復活戦から来た人は、2連勝で優勝です。</div></div>`;
  }
  if (b.champ || b.ready || b.third){
    h += `<div class="card"><div class="lbl">表彰（1〜3位）</div><div class="rank">
      <div class="r1"><span>1位</span>${b.champ ? fullSen(b.champ) + rk(b.k, b.champ) : "決勝で決定"}</div>
      <div class="r2"><span>2位</span>${b.second ? fullSen(b.second) + rk(b.k, b.second) : "決勝で決定"}</div>
      ${(() => { const th = b.champ ? Object.keys(b.ent).filter(p => { const r = rankOf(S, b, p); return r && r.r === 3; }) : (b.third ? [b.third] : []);
        return th.length ? th.map(p => `<div class="r3"><span>${th.length > 1 ? "同率3位" : "3位"}</span>${fullSen(p)}${rk(b.k, p)}</div>`).join("") : `<div class="r3"><span>3位</span>—</div>`; })()}</div></div>`;
  }
  h += standings(b);
  if (isAdmin() && !b.champ){
    const alive = ids.filter(p => !b.ent[p].out);
    h += `<div class="card"><div class="lbl">棄権の処理（残っている人）</div><div class="pcs">${alive.map(p => `<span class="pc ${b.ent[p].losses ? "l" : "w"}">${nm(p, b.k)}<button data-a="wd" data-pid="${p}" data-k="${b.k}">棄権</button></span>`).join("")}</div></div>`;
  }
  return h;
}

// 表彰と順位：フルネーム＋「選手」
function fullSen(p){ const pl = S.players[p]; return pl ? `<span class="nmw"><span class="nmn">${rubyName(pl, true)} 選手</span>${pl.dojo ? `<span class="dj">${esc(pl.dojo)}</span>` : ""}</span>` : "?"; }
function standings(b){
  const ids = Object.keys(b.ent);
  const rows = ids.map(p => ({ p, r: record(S, b.k, p), e: b.ent[p], rank: rankOf(S, b, p) }));
  const key = x => x.rank ? x.rank.r : (x.e.losses === 0 ? -2 : -1);
  rows.sort((x, y) => key(x) - key(y) || y.r.w - x.r.w || x.r.l - y.r.l);
  const lab = x => x.rank ? (x.rank.tie ? "同率" : "") + x.rank.r + "位" : x.e.losses === 0 ? "本戦" : "敗者復活戦";
  const cls = x => x.rank ? (x.rank.r <= 3 ? "s-" + x.rank.r + "位" : "s-rank") : x.e.losses === 0 ? "s-本戦" : "s-敗者復活戦";
  return `<div class="card"><div class="lbl">順位と成績（${esc(keyLabel(b.k))}だけの勝敗）</div>${rows.map(x => `<div class="row"><span class="stg ${cls(x)}">${lab(x)}</span><span class="grow"><b>${fullSen(x.p)}</b>${x.e.wd ? "<em>棄権</em>" : ""}</span><span class="rec2">${x.r.w + x.r.l}戦${x.r.w}勝${x.r.l}敗</span></div>`).join("")}
    ${b.champ ? "" : '<div class="sub" style="margin-top:6px">負けた人の順位は、その時点で決まります。残っている人の順位は決勝のあとに決まります。</div>'}</div>`;
}
function box(m){
  const row = p => {
    const cls = m.st === "d" ? (m.w === p ? "win" : "lose") : "";
    return `<div class="br-r ${cls}"><span>${nm(p, m.k)}</span>${m.st === "d" && m.w === p ? "<i>勝</i>" : ""}</div>`;
  };
  const tag = m.st === "p" ? `<div class="bt now">${TNAME[m.table]}で試合中</div>` : m.st === "q" ? `<div class="bt">待ち</div>` : m.wd ? `<div class="bt">棄権</div>` : "";
  const fx = isAdmin() && m.st === "d" && !m.wd && m.evId ? `<button class="bfix" data-a="fix" data-mid="${m.id}">修正する</button>` : "";
  return `<div class="bx ${m.st === "p" ? "playing" : ""}">${m.pool === "F2" ? '<div class="bt">2試合目</div>' : ""}${row(m.a)}${row(m.b)}${tag}${fx}</div>`;
}
function bracketView(b, pool){
  const R = b.rounds[pool];
  if (!R.length) return pool === "L" ? `<div class="card"><div class="lbl">敗者復活戦</div><div class="sub">本戦で負けた人がここに入ります。</div></div>` : "";
  const cols = R.map((round, r) => `<div class="col"><div class="ch">${pool === "W" ? "" : "敗者復活 "}${r + 1}回戦</div><div class="its">${round.map(it => it.bye
    ? `<div class="bx bye"><div class="br-r"><span>${nm(it.bye, b.k)}</span></div><div class="bt">不戦勝</div></div>` : box(S.m[it.mid])).join("")}</div></div>`).join("");
  const alive = Object.keys(b.ent).filter(p => !b.ent[p].out && b.ent[p].losses === (pool === "W" ? 0 : 1));
  const lastDone = R[R.length - 1].every(it => it.bye || S.m[it.mid].st === "d");
  const tail = lastDone && alive.length === 1 && b.ready ? `<div class="col"><div class="ch">${pool === "W" ? "本戦 1位通過" : "敗者復活 通過"}</div><div class="its"><div class="bx adv"><div class="br-r win"><span>${nm(alive[0], b.k)}</span></div><div class="bt">決勝へ</div></div></div></div>` : "";
  return `<div class="card"><div class="lbl">${pool === "W" ? "本戦（負けたら敗者復活戦へ）" : "敗者復活戦（負けたら終了）"}</div><div class="bk">${cols}${tail}</div>
    <div class="sub sw">横にスクロールできます →</div></div>`;
}

// ---------- 登録の入力欄（本部・選手の自己登録で共通） ----------
function regForm(selfMode){
  const ed = !selfMode && ui.editPid && S.players[ui.editPid] ? S.players[ui.editPid] : null;
  // 試合開始のあとの修正：試合が始まっているクラスからは動かせない・移れない
  const after = ed && S.started && !ed.excluded;
  const curBegun = a => after && (ed.en[a] || []).some(c => begun(S, c + "_" + a));
  // 試合開始のあとに新しく登録する人（遅刻など）：もう始まっているクラスは選べない
  const late = S.started && (!ed || ed.excluded);
  const lockC = (a, c) => (after && (curBegun(a) || (c && begun(S, c + "_" + a)))) || (late && c && begun(S, c + "_" + a));
  const armRow = (a, label) => `<div class="lbl" id="arm_${a}">${label}</div><div class="opts">
      <button data-a="ent" data-arm="${a}" data-v="" class="opt off ${!(ui["e" + a] || []).length ? "on" : ""}" ${lockC(a, "") ? "disabled" : ""}>出ない（No Entry）</button>
      ${CLS.map(c => `<button data-a="ent" data-arm="${a}" data-v="${c[0]}" class="opt ${(ui["e" + a] || []).includes(c[0]) ? "on" : ""}" ${lockC(a, c[0]) ? "disabled" : ""}>${c[1]}${late && begun(S, c[0] + "_" + a) ? '<small class="ongo">試合中</small>' : ""}</button>`).join("")}</div>
      ${late && CLS.some(c => begun(S, c[0] + "_" + a)) ? `<div class="sub">「試合中」のクラスは、もう始まっているので選べません。まだ始まっていない上のクラスなら出られます。</div>` : ""}
      ${curBegun(a) ? `<div class="sub">この腕のクラスはもう試合が始まっているので、変更できません。</div>` : ""}`;
  const nL = (ui.eL || []).length ? 1 : 0, nR = (ui.eR || []).length ? 1 : 0;
  const feeNow = nL + nR === 2 ? `ツーハンド（両腕）${FEE_TWO.toLocaleString()}円` : nL + nR === 1 ? `ワンハンド（片腕）${FEE_ONE.toLocaleString()}円` : "";

function dojoChips(){
  const g = {};
  Object.values(S.players).forEach(p => { if (!p.dojo || !dojoKey(p.dojo)) return; const k = dojoKey(p.dojo); (g[k] = g[k] || {}); g[k][p.dojo] = (g[k][p.dojo] || 0) + 1; });
  const list = Object.values(g).map(v => { const names = Object.keys(v).sort((a, b) => v[b] - v[a]); return { name: names[0], n: names.reduce((t, x) => t + v[x], 0) }; })
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, "ja")).slice(0, 24);
  const cur = (ui.f.f_dojo || "").trim();
  const names = ["無所属"].concat(list.map(d => d.name));
  return `<div class="sub" style="margin:8px 0 4px">ここから選べます（押すと上の欄に入ります）／Tap to choose</div>
    <div class="djchips">${names.map(n => `<button type="button" class="djchip ${n === cur ? "on" : ""}" data-a="dojopick" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>`;
}
function statusBadges(pl){
  let h = "";
  if (needWeigh(pl)) h += pl.weighed ? `<span class="bdg ok">検量OK</span>` : `<span class="bdg ng">検量まだ</span>`;
  h += pl.paid ? `<span class="bdg ok">入金済み</span>` : `<span class="bdg ng">未払い ${feeOf(pl).toLocaleString()}円</span>`;

function playerSort(ids){
  const coll = new Intl.Collator("ja");
  const lat = s => /^[\x00-\x7F]/.test(s);
  const key = pl => (pl.kLast || pl.last || "") + " " + (pl.kFirst || pl.first || "");
  return ids.sort((x, y) => { const a = S.players[x], b = S.players[y]; const la = lat(key(a)), lb = lat(key(b)); if (la !== lb) return la ? 1 : -1; return coll.compare(key(a), key(b)); });
}
function entryText(pl){ return ["L","R"].filter(a => pl.en[a] && pl.en[a].length).map(a => armLabel(a) + "：" + pl.en[a].map(clsLabel).join("・")).join("　"); }

async function autoResults(){
  const ms = S.m.filter(m => m.st === "p");
  const f = S.finalOrder.map(i => S.m[i]).find(m => m.st !== "d");
  if (f) ms.push(f);
  if (!ms.length) return toast("結果を入れる試合がありません");
  for (const m of ms) push({ type: "result", mid: m.id, w: Math.random() < .5 ? m.a : m.b, a: m.a, b: m.b });
}

// 検索欄：打っている間は何もしない。「検索」ボタンかEnterで探す
document.getElementById("app").addEventListener("input", e => { if (e.target && e.target.id === "f_search") ui.f.f_search = e.target.value; if (e.target && e.target.id === "f_dojo"){ ui.f.f_dojo = e.target.value; markDojo(); } });
// 道場ボタンの色：上の欄と同じ名前のボタンに色をつける
function markDojo(){ const v = (ui.f.f_dojo || "").trim(); document.querySelectorAll(".djchip").forEach(b => b.classList.toggle("on", b.dataset.v === v)); }
document.getElementById("app").addEventListener("compositionstart", e => { if (e.target && e.target.id === "f_search") ui.composing = true; });
document.getElementById("app").addEventListener("compositionend", e => { if (e.target && e.target.id === "f_search"){ ui.composing = false; ui.f.f_search = e.target.value; } });
document.getElementById("app").addEventListener("keydown", e => { if (e.target && e.target.id === "f_search" && e.key === "Enter" && !e.isComposing && !ui.composing){ e.preventDefault(); doSearch(); } });
function doSearch(){
  const el = document.getElementById("f_search"); const v = el ? el.value : (ui.f.f_search || "");
  ui.f.f_search = v; ui.q = v.trim();
  if (el) el.blur();   // スマホのキーボードを閉じる
  ui.lastHtml = ""; render();
  goResults();
}
// 結果の一覧まで画面を動かす
function goResults(){ setTimeout(() => { const r = document.getElementById("results"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50); }
window.addEventListener("online", () => { online = true; render(); flush(); });
window.addEventListener("offline", () => { online = false; render(); });
setInterval(() => { if (outbox.length) flush(); }, 10000);

// ---------- 起動 ----------
// QRコードから開いたとき（URLの最後に ?entry）：いきなり出場登録の画面を出す
// 運営として使っている端末は、そのまま運営のまま。試合が始まっていたら「選手・観客」の画面にする
function openFromQR(){
  let q = ""; try { q = location.search || ""; } catch (e) {}
  if (!/(^|[?&])entry(=|&|$)/.test(q.replace(/^\?/, "&"))) return;
  if (ui.role === "staff" || ui.practice) return;
  if (S.started){ ui.role = "viewer"; ui.tab = "match"; }
  else { ui.role = "entrant"; ui.tab = "self"; }
  saveRole(); ui.lastHtml = ""; window.scrollTo(0, 0); render();
}
function startLocal(){ mode = "local"; loadLocal(); recompute(); dataReady = true; if (isAdmin() && !S.started) ui.tab = "entry"; render(); }
(async () => {
  render();
  // Googleの中で動いているとき（本番用）
  if (window.AW_API || (typeof google !== "undefined" && google.script && google.script.run)){
    mode = "gas"; loadOutbox(); document.title = "関谷塾杯 トーナメント表";
    try { ui.pass = localStorage.getItem("aw_pass") || ""; } catch (e) { ui.pass = ""; }
    const timer = setTimeout(() => { if (!dataReady) toast("接続に時間がかかっています。少し待ってください"); }, 10000);
    await poll(); clearTimeout(timer); flush();
    try { if (localStorage.getItem("aw_practice_on") === "1") startPractice(); } catch (e) {}
    openFromQR();
    // 運営は3秒ごと、見る人は5秒ごとに新しい記録を見に行く（画面を閉じているときは休む）
    let tick = 0;
    setInterval(() => { tick++; if (document.visibilityState === "hidden") return; if (ui.role === "staff" || tick % 2 === 0) poll(); }, 2500);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
    return;
  }
  if (!window.claude || typeof window.claude.use !== "function"){ startLocal(); return; }
  let d = null;
  try { d = await window.claude.use("db"); } catch (e) { d = null; }
  if (!d){ startLocal(); return; }
  db = d; mode = "db"; loadOutbox();
  try {
    const u = await window.claude.use("user");
    if (u && typeof u.can === "function"){ const c = await u.can("data.write"); if (c === false) canWrite = false; }
  } catch (e) {}
  let first = true;
  const timer = setTimeout(() => toast("接続に時間がかかっています。表示が古い可能性があります"), 10000);
  db.collection("events").orderBy("t").onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); if (!dataReady){ dataReady = true; ui.deskSeenTable = undefined; } }
    serverEvs = snap.docs.map(x => Object.assign({}, x.data(), { id: x.id }));
    mergeEvs();
    if (first){ first = false; if (isAdmin() && !S.started) ui.tab = "entry"; }
    render();
  }, err => { clearTimeout(timer); toast("データを読み込めませんでした"); });
  mergeEvs(); render(); flush();
})();
</script></body></html>
